<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Viagens / cadstro</title>
    <link rel="shortcut icon" href="logo-imagens/AeroPlaneta.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a71cd3f6c2.js" crossorigin="anonymous"></script>
</head>

<body>

    <header class="header-formulario">
        <img src="logo-imagens/LogoCompleta.png" alt="Logo da Aero Viagens" class="Logo-header">
    </header>

    <main>

        <!-- comeco da section-06 -->
        <section class="section06">

            <div class="div-formulario">

                <form action="">

                    <label for="">Nome:</label>
                    <input type="text">
                    <br><br>

                    <label for="">E-mail:</label>
                    <input type="text">
                    <br><br>

                    <label for="">Confirmar E-mail:</label>
                    <input type="text">
                    <br><br>

                    <label for="">Senha:</label>
                    <input type="password">
                    <br><br>

                    <label for="">Confirmar senha:</label>
                    <input type="password">
                    <br><br>

                    <div class="finalizar-resetar">
                        <input type="reset" value="Resetar formulario" class="botoes-inscricao">
                        <input type="submit" value="Finalizar inscricao" class="botoes-inscricao">
                    </div>

                </form>

            </div>

            <a href="AeroViagensHome.html" class="viagens-internacionais">Voltar ao Inicio</a>

        </section>
        <!-- Fim da section-06 -->
    </main>

    <footer>

        <div class="footer-conteudo">
            <img src="logo-imagens/LogoCompleta.png"
                alt="Logo Da Aero Viagens">
        </div>

        <div class="direitos">
            <h3 class="direito">Todos os Direitos Reservados</h3>
            <p>2026</p>
        </div>

        <div class="div-icon">
            <i class="fa-brands fa-square-x-twitter"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
        </div>

    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

</html>
